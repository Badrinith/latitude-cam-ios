<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2100" viewBox="0 0 1800 2100">
  <defs>
    <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#eee1c5"/><stop offset="1" stop-color="#cdbb94"/></linearGradient>
    <linearGradient id="body" x2="0" y2="1"><stop stop-color="#30322e"/><stop offset=".5" stop-color="#111310"/><stop offset="1" stop-color="#292923"/></linearGradient>
    <linearGradient id="brass" x2="1" y2="1"><stop stop-color="#f0d58a"/><stop offset=".35" stop-color="#9e712b"/><stop offset=".65" stop-color="#4f3215"/><stop offset="1" stop-color="#d4aa55"/></linearGradient>
    <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#2d5b5b"/><stop offset=".55" stop-color="#102b2c"/><stop offset="1" stop-color="#071617"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="10" flood-opacity=".35"/></filter>
    <pattern id="grain" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".7" fill="#745c33" opacity=".18"/><circle cx="11" cy="9" r=".55" fill="#fff" opacity=".12"/></pattern>
    <g id="phone">
      <rect x="0" y="0" width="300" height="520" rx="38" fill="url(#body)" stroke="#c39a4f" stroke-width="4"/>
      <rect x="14" y="16" width="272" height="488" rx="27" fill="#080a09" stroke="#644719" stroke-width="2"/>
      <rect x="28" y="88" width="244" height="286" rx="4" fill="url(#glass)"/>
      <path d="M28 88h244v286H28z" fill="url(#grain)" opacity=".55"/>
      <path d="M150 88v286M28 231h244" stroke="#d3bb84" stroke-width="1" opacity=".45"/>
      <rect x="92" y="31" width="116" height="30" rx="15" fill="#161813" stroke="#8f6c30"/>
      <text x="150" y="51" text-anchor="middle" fill="#f3e5bd" font-family="Georgia" font-size="13" letter-spacing="2">LATITUDE</text>
      <circle cx="52" cy="430" r="20" fill="#1a1c17" stroke="#bd913e" stroke-width="2"/>
      <rect x="38" y="416" width="28" height="28" rx="3" fill="#71715a"/>
      <circle cx="150" cy="430" r="42" fill="#0c0e0c" stroke="url(#brass)" stroke-width="7"/>
      <circle cx="150" cy="430" r="28" fill="none" stroke="#f2d68e" stroke-width="2" opacity=".7"/>
      <circle cx="248" cy="430" r="20" fill="#1a1c17" stroke="#bd913e" stroke-width="2"/>
      <text x="150" y="482" text-anchor="middle" fill="#ded0a9" font-family="Georgia" font-size="10" letter-spacing="2">PRO  ·  FRAME  ·  METER</text>
    </g>
    <g id="topDeck">
      <rect x="28" y="66" width="244" height="20" rx="4" fill="#262820" stroke="#8d6b2f"/>
      <text x="47" y="80" fill="#e7d4a4" font-family="Georgia" font-size="9">SET</text><text x="112" y="80" fill="#e7d4a4" font-family="Georgia" font-size="9">RAW</text><text x="176" y="80" fill="#e7d4a4" font-family="Georgia" font-size="9">024</text><text x="233" y="80" fill="#e7d4a4" font-family="Georgia" font-size="9">FLIP</text>
    </g>
    <g id="sideDials">
      <circle cx="48" cy="245" r="25" fill="url(#brass)" stroke="#f1d690" stroke-width="1"/><circle cx="48" cy="245" r="15" fill="#29271d"/><path d="M48 225v12" stroke="#f1d690" stroke-width="2"/><text x="48" y="284" text-anchor="middle" fill="#ead8ab" font-family="Georgia" font-size="9">ISO 100</text>
      <circle cx="252" cy="245" r="25" fill="url(#brass)" stroke="#f1d690" stroke-width="1"/><circle cx="252" cy="245" r="15" fill="#29271d"/><path d="M252 225v12" stroke="#f1d690" stroke-width="2"/><text x="252" y="284" text-anchor="middle" fill="#ead8ab" font-family="Georgia" font-size="9">1/250</text>
    </g>
  </defs>
  <rect width="1800" height="2100" fill="url(#paper)"/>
  <path d="M80 90H1720M80 2010H1720" stroke="#704b21" stroke-width="3"/>
  <text x="900" y="135" text-anchor="middle" fill="#2c251a" font-family="Georgia" font-size="54" letter-spacing="8">LATITUDE / THE MECHANICAL VIEWFINDER</text>
  <text x="900" y="178" text-anchor="middle" fill="#604d32" font-family="Georgia" font-size="22" letter-spacing="3">FIFTEEN ORIGINAL CONTROL SYSTEMS FOR THE CAMERA WE ALREADY HAVE</text>
  <!-- 01 --> <g transform="translate(120 260)" filter="url(#shadow)"><use href="#phone"/><use href="#topDeck"/><use href="#sideDials"/><path d="M205 61v-35h34v44" fill="none" stroke="url(#brass)" stroke-width="9" stroke-linecap="round"/><text x="150" y="550" text-anchor="middle" font-family="Georgia" font-size="19" fill="#2c251a">01 · BRASS WINDER</text><text x="150" y="575" text-anchor="middle" font-family="Georgia" font-size="12" fill="#604d32">RAW/JPEG advance lever</text></g>
  <!-- 02 --> <g transform="translate(450 260)" filter="url(#shadow)"><use href="#phone"/><use href="#topDeck"/><use href="#sideDials"/><path d="M106 88v-40h88v40" fill="#1e211b" stroke="url(#brass)" stroke-width="4"/><path d="M118 71h62" stroke="#e7ca76" stroke-width="3"/><circle cx="150" cy="70" r="4" fill="#e7ca76"/><text x="150" y="550" text-anchor="middle" font-family="Georgia" font-size="19" fill="#2c251a">02 · FOLDING METER</text><text x="150" y="575" text-anchor="middle" font-family="Georgia" font-size="12" fill="#604d32">histogram on a flip-up deck</text></g>
  <!-- 03 --> <g transform="translate(780 260)" filter="url(#shadow)"><use href="#phone"/><use href="#topDeck"/><circle cx="70" cy="380" r="37" fill="url(#brass)"/><circle cx="230" cy="380" r="37" fill="url(#brass)"/><path d="M70 348v18M230 348v18" stroke="#f9e5a8" stroke-width="3"/><text x="70" y="385" text-anchor="middle" font-family="Georgia" font-size="10" fill="#19170f">ISO</text><text x="230" y="385" text-anchor="middle" font-family="Georgia" font-size="10" fill="#19170f">S</text><text x="150" y="550" text-anchor="middle" font-family="Georgia" font-size="19" fill="#2c251a">03 · TWIN CROWNS</text><text x="150" y="575" text-anchor="middle" font-family="Georgia" font-size="12" fill="#604d32">thumb dials for exposure</text></g>
  <!-- 04 --> <g transform="translate(1110 260)" filter="url(#shadow)"><use href="#phone"/><use href="#topDeck"/><circle cx="150" cy="231" r="122" fill="none" stroke="url(#brass)" stroke-width="8" opacity=".95"/><text x="150" y="120" text-anchor="middle" fill="#f0dba1" font-family="Georgia" font-size="10">0.5X · 1X · 2X</text><text x="150" y="550" text-anchor="middle" font-family="Georgia" font-size="19" fill="#2c251a">04 · HELICAL LENS</text><text x="150" y="575" text-anchor="middle" font-family="Georgia" font-size="12" fill="#604d32">lens and focus collar</text></g>
  <!-- 05 --> <g transform="translate(1440 260)" filter="url(#shadow)"><use href="#phone"/><use href="#topDeck"/><rect x="95" y="100" width="110" height="24" rx="12" fill="#34291c" stroke="url(#brass)" stroke-width="3"/><path d="M104 112h85" stroke="#e8cb76"/><circle cx="153" cy="112" r="5" fill="#e8cb76"/><rect x="31" y="350" width="60" height="14" rx="7" fill="#8a6730"/><text x="61" y="361" text-anchor="middle" font-family="Georgia" font-size="8" fill="#20180d">PORTRA 400</text><text x="150" y="550" text-anchor="middle" font-family="Georgia" font-size="19" fill="#2c251a">05 · FIELD CAMERA</text><text x="150" y="575" text-anchor="middle" font-family="Georgia" font-size="12" fill="#604d32">cartridge and needle meter</text></g>
  <!-- Row 2 -->
  <g transform="translate(120 870)" filter="url(#shadow)"><use href="#phone"/><use href="#topDeck"/><path d="M37 120l20-14 20 14-20 14zM223 120l20-14 20 14-20 14z" fill="url(#brass)"/><path d="M48 130l102 101 102-101" fill="none" stroke="#c9a958" stroke-width="3" opacity=".7"/><text x="150" y="550" text-anchor="middle" font-family="Georgia" font-size="19" fill="#2c251a">06 · PRISM GEARS</text><text x="150" y="575" text-anchor="middle" font-family="Georgia" font-size="12" fill="#604d32">gear-linked lens selector</text></g>
  <g transform="translate(450 870)" filter="url(#shadow)"><use href="#phone"/><use href="#topDeck"/><path d="M35 106h230v24H35z" fill="#262820" stroke="url(#brass)" stroke-width="3"/><circle cx="65" cy="118" r="14" fill="url(#brass)"/><circle cx="150" cy="118" r="14" fill="url(#brass)"/><circle cx="235" cy="118" r="14" fill="url(#brass)"/><text x="65" y="121" text-anchor="middle" font-size="8">.5</text><text x="150" y="121" text-anchor="middle" font-size="8">1</text><text x="235" y="121" text-anchor="middle" font-size="8">2</text><text x="150" y="550" text-anchor="middle" font-family="Georgia" font-size="19" fill="#2c251a">07 · IRIS RAIL</text><text x="150" y="575" text-anchor="middle" font-family="Georgia" font-size="12" fill="#604d32">focal lengths on a top rail</text></g>
  <g transform="translate(780 870)" filter="url(#shadow)"><use href="#phone"/><use href="#topDeck"/><path d="M30 300h240" stroke="url(#brass)" stroke-width="5"/><circle cx="75" cy="300" r="18" fill="#24241e" stroke="#e5c875" stroke-width="4"/><circle cx="150" cy="300" r="18" fill="#24241e" stroke="#e5c875" stroke-width="4"/><circle cx="225" cy="300" r="18" fill="#24241e" stroke="#e5c875" stroke-width="4"/><text x="150" y="550" text-anchor="middle" font-family="Georgia" font-size="19" fill="#2c251a">08 · APERTURE TRACK</text><text x="150" y="575" text-anchor="middle" font-family="Georgia" font-size="12" fill="#604d32">lens stops as metal detents</text></g>
  <g transform="translate(1110 870)" filter="url(#shadow)"><use href="#phone"/><use href="#topDeck"/><path d="M35 174h34M35 187h34M231 174h34M231 187h34" stroke="#ecd68f" stroke-width="3"/><text x="52" y="210" text-anchor="middle" fill="#ead8ab" font-family="Georgia" font-size="9">WB</text><text x="248" y="210" text-anchor="middle" fill="#ead8ab" font-family="Georgia" font-size="9">FOCUS</text><text x="150" y="550" text-anchor="middle" font-family="Georgia" font-size="19" fill="#2c251a">09 · WATCHMAKER</text><text x="150" y="575" text-anchor="middle" font-family="Georgia" font-size="12" fill="#604d32">small precision side wheels</text></g>
  <g transform="translate(1440 870)" filter="url(#shadow)"><use href="#phone"/><use href="#topDeck"/><rect x="82" y="335" width="136" height="36" rx="6" fill="#1e201a" stroke="url(#brass)" stroke-width="3"/><text x="150" y="358" text-anchor="middle" fill="#e9d398" font-family="Georgia" font-size="10">PRO / PULL OUT</text><text x="150" y="550" text-anchor="middle" font-family="Georgia" font-size="19" fill="#2c251a">10 · PRO DRAWER</text><text x="150" y="575" text-anchor="middle" font-family="Georgia" font-size="12" fill="#604d32">manual controls slide from base</text></g>
  <!-- Row 3 -->
  <g transform="translate(120 1480)" filter="url(#shadow)"><use href="#phone"/><use href="#topDeck"/><path d="M92 385c14-22 102-22 116 0" fill="none" stroke="url(#brass)" stroke-width="6"/><rect x="112" y="366" width="76" height="23" rx="4" fill="#3b2d1c" stroke="#e1be66"/><text x="150" y="550" text-anchor="middle" font-family="Georgia" font-size="19" fill="#2c251a">11 · FILM CASSETTE</text><text x="150" y="575" text-anchor="middle" font-family="Georgia" font-size="12" fill="#604d32">simulation selector at base</text></g>
  <g transform="translate(450 1480)" filter="url(#shadow)"><use href="#phone"/><use href="#topDeck"/><circle cx="150" cy="73" r="21" fill="url(#brass)"/><text x="150" y="78" text-anchor="middle" font-family="Georgia" font-size="10">024</text><text x="150" y="550" text-anchor="middle" font-family="Georgia" font-size="19" fill="#2c251a">12 · FRAME CLOCK</text><text x="150" y="575" text-anchor="middle" font-family="Georgia" font-size="12" fill="#604d32">numbered frame counter wheel</text></g>
  <g transform="translate(780 1480)" filter="url(#shadow)"><use href="#phone"/><use href="#topDeck"/><path d="M42 100h216l-15 35H57z" fill="#171913" stroke="url(#brass)" stroke-width="3"/><path d="M60 118h180" stroke="#d8b86b" stroke-width="2"/><text x="150" y="550" text-anchor="middle" font-family="Georgia" font-size="19" fill="#2c251a">13 · DARKROOM TRAY</text><text x="150" y="575" text-anchor="middle" font-family="Georgia" font-size="12" fill="#604d32">RAW settings unfold on deck</text></g>
  <g transform="translate(1110 1480)" filter="url(#shadow)"><use href="#phone"/><use href="#topDeck"/><path d="M43 340h214" stroke="#b78b37" stroke-width="3"/><path d="M86 340v25M150 340v25M214 340v25" stroke="#e6cf8c" stroke-width="2"/><text x="150" y="357" text-anchor="middle" fill="#e8d5a6" font-family="Georgia" font-size="10">-2   0   +2</text><text x="150" y="550" text-anchor="middle" font-family="Georgia" font-size="19" fill="#2c251a">14 · EXPOSURE SCALE</text><text x="150" y="575" text-anchor="middle" font-family="Georgia" font-size="12" fill="#604d32">metering as a brass ruler</text></g>
  <g transform="translate(1440 1480)" filter="url(#shadow)"><use href="#phone"/><use href="#topDeck"/><path d="M150 85v-32M135 70l15-17 15 17" stroke="url(#brass)" stroke-width="5" fill="none"/><path d="M116 398h68" stroke="#ddbd68" stroke-width="4"/><text x="150" y="410" text-anchor="middle" fill="#f0dca1" font-family="Georgia" font-size="8">PRESS + WIND</text><text x="150" y="550" text-anchor="middle" font-family="Georgia" font-size="19" fill="#2c251a">15 · WIND &amp; RELEASE</text><text x="150" y="575" text-anchor="middle" font-family="Georgia" font-size="12" fill="#604d32">shutter with capture progress</text></g>
  <text x="900" y="2060" text-anchor="middle" fill="#604d32" font-family="Georgia" font-size="16" letter-spacing="2">ORIGINAL DIRECTION: ANTIQUE PRECISION INSTRUMENT, NOT A REPLICA</text>
</svg>
